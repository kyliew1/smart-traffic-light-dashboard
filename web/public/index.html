<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Intersection Traffic Light Dashboard</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f6f7f9;
    }

    .card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px;
      margin: 12px 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .status-online {
      color: green;
      font-weight: bold;
    }

    .status-offline {
      color: red;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .intersection {
      text-align: center;
    }

    .traffic-light {
      width: 70px;
      background: #222;
      border-radius: 20px;
      padding: 10px;
      margin: 10px auto;
    }

    .bulb {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      margin: 8px auto;
      background: #555;
      opacity: 0.25;
    }

    .red.active {
      background: red;
      opacity: 1;
    }

    .yellow.active {
      background: gold;
      opacity: 1;
    }

    .green.active {
      background: limegreen;
      opacity: 1;
    }

    button {
      margin: 5px;
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      background: #1f6feb;
      color: white;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    #commandStatus {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Intersection Traffic Light Dashboard</h1>

  <div class="card">
    <h3>
      ESP32 Status:
      <span id="esp32Status" class="status-offline">offline</span>
    </h3>
    <p>Mode: <span id="mode">unknown</span></p>
    <p>Phase: <span id="phase">unknown</span></p>
    <p>Last Update: <span id="timestamp">-</span></p>
  </div>

  <div class="card">
    <h3>Intersections</h3>

    <div class="grid">
      <div class="intersection">
        <h4>Intersection 1</h4>
        <div class="traffic-light" data-intersection="1">
          <div class="bulb red"></div>
          <div class="bulb yellow"></div>
          <div class="bulb green"></div>
        </div>
        <p id="state1">RED</p>
      </div>

      <div class="intersection">
        <h4>Intersection 2</h4>
        <div class="traffic-light" data-intersection="2">
          <div class="bulb red"></div>
          <div class="bulb yellow"></div>
          <div class="bulb green"></div>
        </div>
        <p id="state2">RED</p>
      </div>

      <div class="intersection">
        <h4>Intersection 3</h4>
        <div class="traffic-light" data-intersection="3">
          <div class="bulb red"></div>
          <div class="bulb yellow"></div>
          <div class="bulb green"></div>
        </div>
        <p id="state3">RED</p>
      </div>

      <div class="intersection">
        <h4>Intersection 4</h4>
        <div class="traffic-light" data-intersection="4">
          <div class="bulb red"></div>
          <div class="bulb yellow"></div>
          <div class="bulb green"></div>
        </div>
        <p id="state4">RED</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>Controls</h3>
    <button onclick="sendCommand('normal')">Normal Sequential</button>
    <button onclick="sendCommand('two_way')">Two-way Opposing</button>
    <button onclick="sendCommand('all_red')">All Red</button>
    <button onclick="sendCommand('emergency')">Emergency Flash</button>
    <p id="commandStatus"></p>
  </div>

  <div class="card">
    <h3>Alerts</h3>
    <ul id="alerts"></ul>
  </div>

  <script>
    const socket = io();

    function setIntersectionLight(number, state) {
      const normalized = String(state || "RED").toUpperCase();
      const trafficLight = document.querySelector(`[data-intersection="${number}"]`);

      trafficLight.querySelectorAll(".bulb").forEach((bulb) => {
        bulb.classList.remove("active");
      });

      if (normalized === "RED") {
        trafficLight.querySelector(".red").classList.add("active");
      } else if (normalized === "YELLOW") {
        trafficLight.querySelector(".yellow").classList.add("active");
      } else if (normalized === "GREEN") {
        trafficLight.querySelector(".green").classList.add("active");
      }

      document.getElementById(`state${number}`).innerText = normalized;
    }

    function updateDashboard(data) {
      const status = document.getElementById("esp32Status");

      status.innerText = data.esp32_status || "offline";
      status.className = data.esp32_status === "online" ? "status-online" : "status-offline";

      document.getElementById("mode").innerText = data.mode || "unknown";
      document.getElementById("phase").innerText = data.phase || "unknown";
      document.getElementById("timestamp").innerText = data.timestamp || "-";

      const intersections = data.intersections || {};
      setIntersectionLight(1, intersections["1"] || intersections[1]);
      setIntersectionLight(2, intersections["2"] || intersections[2]);
      setIntersectionLight(3, intersections["3"] || intersections[3]);
      setIntersectionLight(4, intersections["4"] || intersections[4]);
    }

    socket.on("trafficUpdate", updateDashboard);

    socket.on("trafficAlert", (alert) => {
      const li = document.createElement("li");
      li.textContent = JSON.stringify(alert);
      document.getElementById("alerts").prepend(li);
    });

    async function sendCommand(mode) {
      const status = document.getElementById("commandStatus");

      try {
        const res = await fetch("/api/command", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "set_mode", value: mode })
        });

        const data = await res.json();

        if (!res.ok) {
          status.innerText = data.error || "Command failed";
          return;
        }

        status.innerText = `Command sent: ${mode}`;
      } catch (err) {
        status.innerText = "Could not send command";
      }
    }

    fetch("/api/status")
      .then((res) => res.json())
      .then(updateDashboard)
      .catch(() => {});
  </script>
</body>
</html>
